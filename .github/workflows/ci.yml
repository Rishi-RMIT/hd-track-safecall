name: HD checks and rules deployment
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  quality:
    if: github.repository == 'Rishi-RMIT/hd-track-safecall'
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm -r format:check
      - run: pnpm run test:all
      - run: pnpm audit --audit-level=high
      - run: pnpm run build
  deploy-rules:
    name: Deploy Firestore rules
    needs: quality
    if: github.repository == 'Rishi-RMIT/hd-track-safecall' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RULES_SERVICE_ACCOUNT }}
      - run: node scripts/deployment/deploy-rules.mjs
