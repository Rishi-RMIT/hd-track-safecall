pre-commit:
  commands:
    validate-placeholders:
      run: node scripts/validate-placeholders.js

    format:
      glob: '**/*.{ts,tsx,json,md,css}'
      exclude: '(node_modules|\.next|\.git)'
      run: pnpm exec prettier --write {staged_files} || true

    lint-frontend:
      root: 'frontend/'
      glob: 'src/**/*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}

    lint-backend:
      root: 'backend/'
      glob: 'src/**/*.ts'
      run: pnpm exec eslint --fix {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/check-commit-msg.js {1}
